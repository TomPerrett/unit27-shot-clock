<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Unit 27 Shot Clock">
<title>Unit 27 Shot Clock</title>
<style>
  :root {
    --yellow: #f2d94a;
    --blue: #3d5280;
    --green: #4a8044;
    --red: #d32f2f;
    --ext-yellow: #f2d94a;
    --purple: #33006b;
    --outline: #111;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #000;
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
  }
  .app {
    width: 100%;
    max-width: 520px;
    height: 100%;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: calc(12px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
    position: relative;
  }

  /* Header: logo + flip toggle */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .logo {
    height: 44px;
    filter: drop-shadow(0 0 1px rgba(255,255,255,.6));
    max-width: 55%;
    object-fit: contain;
    object-position: left center;
  }
  .brand-fallback {
    display: none;
    font-weight: 800;
    letter-spacing: .04em;
    font-size: 1.3rem;
  }
  #flipToggle {
    height: auto;
    padding: 8px 14px;
    font-size: .85rem;
    border-width: 2px;
    background: rgba(255,255,255,.08);
    box-shadow: none;
    white-space: nowrap;
  }

  /* Big number */
  .display-wrap {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 0;
    position: relative;
    margin: 0 -14px;
  }
  .watermark {
    position: absolute;
    inset: 4% 8%;
    background-position: center;
    background-repeat: no-repeat;
    background-size: contain;
    opacity: .11;
    pointer-events: none;
  }
  .display {
    position: relative;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-weight: 500;
    font-size: min(70vw, 40vh, 380px);
    line-height: 1;
    color: #fff;
    font-variant-numeric: tabular-nums;
    transition: color .2s;
  }
  .display.warn   { color: #f5a623; }
  .display.danger { color: #ff4a4a; animation: pulse 1s infinite; }
  .display.over   { color: #ff4a4a; animation: flash .5s infinite; }
  @keyframes pulse { 50% { opacity: .65; } }
  @keyframes flash { 50% { opacity: .15; } }

  /* Opponent view: big clock upside down, buttons and mini clock upright */
  body.flipped .display { transform: rotate(180deg); }
  .mini {
    display: none;
    text-align: center;
    font-family: Impact, Haettenschweiler, "Arial Narrow Bold", "Roboto Condensed", sans-serif;
    font-size: 2.6rem;
    line-height: 1;
    color: #fff;
    font-variant-numeric: tabular-nums;
    margin-bottom: 10px;
  }
  body.flipped .mini { display: block; }
  .mini.warn   { color: #f5a623; }
  .mini.danger { color: #ff4a4a; }
  .mini.over   { color: #ff4a4a; }

  .status {
    text-align: center;
    color: rgba(255,255,255,.7);
    font-size: .9rem;
    min-height: 1.3em;
    margin-bottom: 10px;
  }

  /* Buttons */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  button {
    height: clamp(56px, 9vh, 84px);
    font-size: clamp(1.3rem, 6vw, 2rem);
    font-weight: 500;
    color: #fff;
    border: 4px solid #fff;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(0,0,0,.45);
    transition: transform .05s, filter .15s;
  }
  button:active:not(:disabled) { transform: scale(.97); }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  button.wide { grid-column: 1 / -1; }

  /* The big clock can overflow its area; make sure it never blocks taps on the buttons */
  .topbar, .grid { position: relative; z-index: 2; }
  .display-wrap, .watermark, .display { pointer-events: none; }

  /* Before a frame is in play, show the Frames logo instead of the clock */
  body.splash .display { visibility: hidden; }
  body.splash .mini { visibility: hidden; }
  body.splash .watermark { opacity: 1; inset: 12% 2%; }
  body.flipped.splash .watermark { transform: rotate(180deg); }
  #startPause { height: clamp(72px, 12vh, 108px); font-size: clamp(1.6rem, 7.5vw, 2.4rem); }


  #reset      { background: #2f68d6; }
  #startPause { background: #1e9e55; }
  #startPause.running { background: #ee7a14; }
  #redExt     { background: var(--red); }
  #yellowExt  { background: var(--ext-yellow); color: #111; }
  #resetFrame { background: #6c2bd9; }

  button:disabled, button.used {
    background: #2a2a2a !important;
    color: #777 !important;
    border-color: #555;
    cursor: not-allowed;
    box-shadow: none;
  }
  /* A used extension stays tappable so it can be undone */
  button.used:not(:disabled) { cursor: pointer; }
</style>
</head>

      <div id="display" class="display">45</div>
    </div>

    <div id="mini" class="mini">45</div>
    <div id="status" class="status">Ready</div>

    <div class="grid">
      <button id="startPause" class="wide">Start</button>
      <button id="redExt">Red Ext.</button>
      <button id="yellowExt">Yellow Ext.</button>
      <button id="reset">Reset</button>
      <button id="resetFrame">Reset Frame</button>
    </div>
  </main>

<script>
(function () {
  const SHOT_SECONDS = 45;
  const EXT_SECONDS = 15;

  const display = document.getElementById('display');
  const mini = document.getElementById('mini');
  const flipToggle = document.getElementById('flipToggle');
  const statusEl = document.getElementById('status');
  const startPause = document.getElementById('startPause');
  const resetBtn = document.getElementById('reset');
  const redExt = document.getElementById('redExt');
  const yellowExt = document.getElementById('yellowExt');
  const resetFrame = document.getElementById('resetFrame');

  // If the logo can't load (offline), show plain text instead
  const logo = document.getElementById('logo');
  logo.addEventListener('error', function () {
    logo.style.display = 'none';
    document.getElementById('brandFallback').style.display = 'block';
  });

  let remainingMs = SHOT_SECONDS * 1000;
  let endTime = 0;
  let intervalId = null;
  let running = false;
  let started = false;
  let frameActive = false;
  const undoTimer = { red: null, yellow: null };
  let redUsed = false;
  let yellowUsed = false;
  let beeped = {};

  let audioCtx = null;
  function beep(freq, dur) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      gain.gain.value = 0.15;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    } catch (e) { /* audio not available */ }
  }

  function render() {
    document.body.classList.toggle('splash', !frameActive);
    const secs = Math.ceil(remainingMs / 1000);
    display.textContent = secs;
    mini.textContent = secs;
    [display, mini].forEach(function (el) {
      el.classList.remove('warn', 'danger', 'over');
      if (remainingMs <= 0) el.classList.add('over');
      else if (secs <= 5) el.classList.add('danger');
      else if (secs <= 10) el.classList.add('warn');
    });

    startPause.textContent = running ? 'Pause' : (started && remainingMs > 0 ? 'Resume' : 'Start');
    startPause.classList.toggle('running', running);
    startPause.disabled = remainingMs <= 0;
    resetBtn.textContent = running ? 'New Shot' : 'Reset';

    const canExt = remainingMs > 0 && frameActive;
    redExt.disabled = redUsed ? remainingMs <= 0 : !canExt;
    redExt.classList.toggle('used', redUsed);
    redExt.textContent = undoTimer.red ? 'Undo?' : 'Red Ext.';
    yellowExt.disabled = yellowUsed ? remainingMs <= 0 : !canExt;
    yellowExt.classList.toggle('used', yellowUsed);
    yellowExt.textContent = undoTimer.yellow ? 'Undo?' : 'Yellow Ext.';
  }

  function tick() {
    remainingMs = Math.max(0, endTime - Date.now());
    const secs = Math.ceil(remainingMs / 1000);
    if (secs <= 5 && secs > 0 && !beeped[secs]) { beeped[secs] = true; beep(880, 0.08); }
    if (secs === 10 && !beeped[10]) {
      beeped[10] = true;
      try { if (navigator.vibrate) navigator.vibrate([300, 120, 300]); } catch (e) {}
      beep(660, 0.15);
      setTimeout(function () { beep(660, 0.15); }, 250);
    }
    if (remainingMs <= 0) {
      stop();
      statusEl.textContent = 'Time up!';
      beep(440, 0.8);
    }
    render();
  }

  // Keep the screen awake once a shot has been started (where the browser supports it)
  let wakeLock = null;
  async function lockScreen() {
    try {
      if ('wakeLock' in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', function () { wakeLock = null; });
      }
    } catch (e) { wakeLock = null; }
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && started) lockScreen();
  });

  function begin() {
    if (remainingMs <= 0) return;
    lockScreen();
    frameActive = true;
    running = true;
    started = true;
    endTime = Date.now() + remainingMs;
    clearInterval(intervalId);
    intervalId = setInterval(tick, 100);
    statusEl.textContent = 'Shot clock running';
    render();
  }

  function stop() {
    running = false;
    clearInterval(intervalId);
    intervalId = null;
  }

  function pause() {
    remainingMs = Math.max(0, endTime - Date.now());
    stop();
    statusEl.textContent = 'Paused';
    render();
  }

  function resetShot() {
    stop();
    remainingMs = SHOT_SECONDS * 1000;
    beeped = {};
    started = false;
    statusEl.textContent = 'Ready';
    render();
  }

  // While running, the left button restarts the clock at 45 for the next shot and keeps it running
  function newShot() {
    remainingMs = SHOT_SECONDS * 1000;
    endTime = Date.now() + remainingMs;
    beeped = {};
    statusEl.textContent = 'New shot';
    render();
  }

  function useExt(which) {
    if (remainingMs <= 0) return;
    if (which === 'red' && redUsed) return;
    if (which === 'yellow' && yellowUsed) return;
    if (which === 'red') redUsed = true; else yellowUsed = true;

    if (running) {
      endTime += EXT_SECONDS * 1000;
      remainingMs = Math.max(0, endTime - Date.now());
    } else {
      remainingMs += EXT_SECONDS * 1000;
    }
    beeped = {};
    statusEl.textContent = (which === 'red' ? 'Red' : 'Yellow') + ' extension used (+' + EXT_SECONDS + 's)';
    render();
  }

  // Tapping a used extension asks "Undo?"; a second tap within 3 seconds takes the 15 seconds back
  function undoExt(which) {
    if (which === 'red') redUsed = false; else yellowUsed = false;
    if (running) {
      const left = Math.max(1000, (endTime - Date.now()) - EXT_SECONDS * 1000);
      endTime = Date.now() + left;
      remainingMs = left;
    } else {
      remainingMs = Math.max(1000, remainingMs - EXT_SECONDS * 1000);
    }
    beeped = {};
    statusEl.textContent = (which === 'red' ? 'Red' : 'Yellow') + ' extension undone';
    render();
  }

  function handleExt(which) {
    const used = which === 'red' ? redUsed : yellowUsed;
    if (!used) { useExt(which); return; }
    if (undoTimer[which]) {
      clearTimeout(undoTimer[which]);
      undoTimer[which] = null;
      undoExt(which);
    } else {
      undoTimer[which] = setTimeout(function () { undoTimer[which] = null; render(); }, 3000);
      render();
    }
  }

  function resetEverything() {
    ['red', 'yellow'].forEach(function (k) { clearTimeout(undoTimer[k]); undoTimer[k] = null; });
    redUsed = false;
    yellowUsed = false;
    frameActive = false;
    resetShot();
    statusEl.textContent = 'New frame - extensions available';
    render();
  }

  startPause.addEventListener('click', () => (running ? pause() : begin()));
  resetBtn.addEventListener('click', () => (running ? newShot() : resetShot()));
  redExt.addEventListener('click', () => handleExt('red'));
  yellowExt.addEventListener('click', () => handleExt('yellow'));
  // Reset Frame needs a second tap to confirm
  let confirmTimer = null;
  resetFrame.addEventListener('click', function () {
    if (confirmTimer) {
      clearTimeout(confirmTimer);
      confirmTimer = null;
      resetFrame.textContent = 'Reset Frame';
      resetEverything();
    } else {
      resetFrame.textContent = 'Confirm?';
      confirmTimer = setTimeout(function () {
        confirmTimer = null;
        resetFrame.textContent = 'Reset Frame';
      }, 3000);
    }
  });

  // Orientation toggle (remembered where the browser allows it)
  function setFlipped(on) {
    document.body.classList.toggle('flipped', on);
    flipToggle.textContent = on ? 'Big clock: upside down' : 'Big clock: upright';
    flipToggle.setAttribute('aria-pressed', on ? 'true' : 'false');
    try { localStorage.setItem('shotClockFlipped', on ? '1' : '0'); } catch (e) {}
  }
  let startFlipped = true;
  try { if (localStorage.getItem('shotClockFlipped') === '0') startFlipped = false; } catch (e) {}
  setFlipped(startFlipped);
  flipToggle.addEventListener('click', () => setFlipped(!document.body.classList.contains('flipped')));

  render();
})();
</script>
</body>
</html>
